<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <div class="app-brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <h1 class="app-title">TaskFlow</h1>
        </div>
        <div class="stats-bar">
          <span class="stat-chip" id="stat-total">0 tasks</span>
          <span class="stat-chip stat-active" id="stat-active">0 active</span>
          <span class="stat-chip stat-done" id="stat-done">0 done</span>
          <span class="stat-chip stat-overdue hidden" id="stat-overdue">0 overdue</span>
        </div>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="quick-add-section">
      <div class="quick-add-bar">
        <input id="quick-add-input" type="text" placeholder="Add a task… press Enter to save" autocomplete="off" aria-label="Quick add task">
        <button id="expand-form-btn" class="btn-details" title="Add with details" aria-label="Add task with details">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
          </svg>
        </button>
        <button id="quick-add-btn" class="btn-primary">+ Add</button>
      </div>
    </section>

    <section class="controls-bar">
      <div class="filter-tabs" role="tablist">
        <button role="tab" class="tab active" data-filter="all">All</button>
        <button role="tab" class="tab" data-filter="active">Active</button>
        <button role="tab" class="tab" data-filter="completed">Completed</button>
      </div>
      <div class="search-sort-group">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="search-input" type="search" placeholder="Search tasks…" aria-label="Search tasks">
          <button id="search-clear" class="search-clear hidden" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <select id="sort-select" aria-label="Sort tasks">
          <option value="order">Custom order</option>
          <option value="created-desc">Newest first</option>
          <option value="created-asc">Oldest first</option>
          <option value="due-asc">Due date ↑</option>
          <option value="due-desc">Due date ↓</option>
          <option value="priority-desc">Priority ↓</option>
          <option value="priority-asc">Priority ↑</option>
          <option value="alpha-asc">A → Z</option>
          <option value="alpha-desc">Z → A</option>
        </select>
        <select id="category-filter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>
      <div class="bulk-actions">
        <button id="mark-all-btn" class="btn-ghost">Mark all done</button>
        <button id="clear-completed-btn" class="btn-ghost btn-ghost-danger">Clear completed</button>
      </div>
    </section>

    <main class="task-list-container">
      <ul id="task-list" role="list" aria-label="Task list" aria-live="polite"></ul>
      <div id="empty-state" class="empty-state hidden">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="50" fill="currentColor" opacity="0.06"/>
          <path d="M40 55l12 12 28-24" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
          <rect x="30" y="38" width="60" height="8" rx="4" fill="currentColor" opacity="0.1"/>
          <rect x="30" y="56" width="48" height="8" rx="4" fill="currentColor" opacity="0.1"/>
          <rect x="30" y="74" width="36" height="8" rx="4" fill="currentColor" opacity="0.1"/>
        </svg>
        <p id="empty-message">No tasks yet. Add one above!</p>
      </div>
    </main>
  </div>

  <!-- Add/Edit Task Modal -->
  <div id="task-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modal-title">Add Task</h2>
        <button class="modal-close icon-btn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </header>
      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Title <span class="required">*</span></label>
          <input id="task-title" type="text" required placeholder="What needs to be done?" autocomplete="off">
          <span class="field-error hidden" id="title-error">Please enter a title.</span>
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" rows="3" placeholder="Optional details…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input id="task-due" type="date">
          </div>
          <div class="form-group">
            <label for="task-category">Category</label>
            <select id="task-category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="shopping">Shopping</option>
              <option value="health">Health</option>
              <option value="finance">Finance</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="task-tags">Tags <span class="hint">(comma-separated)</span></label>
          <input id="task-tags" type="text" placeholder="e.g. urgent, review, meeting">
        </div>
        <div class="form-group subtasks-group">
          <label>Subtasks</label>
          <ul id="subtask-edit-list" class="subtask-edit-list"></ul>
          <div class="subtask-add-row">
            <input id="subtask-input" type="text" placeholder="Add a subtask… (Enter)">
            <button type="button" id="subtask-add-btn" class="btn-ghost">Add</button>
          </div>
        </div>
        <footer class="modal-footer">
          <button type="button" class="btn-secondary" id="form-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="form-submit">Save Task</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="modal-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
    <div class="modal-content confirm-content">
      <p id="confirm-message">Are you sure?</p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
